<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>

    <h1>Student Registration Form</h1>

    <form action="register.php" method="post" enctype="multipart/form-data">

        <!-- Personal Details -->
        <fieldset>
            <legend>Personal Details</legend>

            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="fullname" required><br><br>

            <label for="enroll">Enrolment Number:</label><br>
            <input type="text" id="enroll" name="enrolment" required><br><br>

            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" maxlength="12" required><br><br>

            <label>Gender:</label><br>
            <input type="radio" id="male" name="gender" value="Male" checked>
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>
        </fieldset>

        <br>

        <!-- Course Details -->
        <fieldset>
            <legend>Course Details</legend>

            <label>Subjects:</label><br>
            <input type="checkbox" id="html" name="subjects[]" value="HTML">
            <label for="html">HTML</label><br>

            <input type="checkbox" id="css" name="subjects[]" value="CSS">
            <label for="css">CSS</label><br>

            <input type="checkbox" id="javascript" name="subjects[]" value="JavaScript">
            <label for="javascript">JavaScript</label><br><br>

            <label for="remarks">Remarks:</label><br>
            <textarea id="remarks" name="remarks" rows="4" cols="30"
                placeholder="Enter your remarks here..."></textarea><br><br>

            <label for="photo">Upload Photo:</label><br>
            <input type="file" id="photo" name="photo" accept="image/*"><br><br>
        </fieldset>

        <br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear">

    </form>

</body>
</html>
